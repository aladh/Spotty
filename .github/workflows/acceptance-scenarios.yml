name: Acceptance scenarios

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      evidence_artifact_url:
        description: Synthetic test log, Rune accessibility tree and screenshot
        value: ${{ jobs.acceptance.outputs.evidence_artifact_url }}
      outcome:
        description: The single corpus execution outcome
        value: ${{ jobs.acceptance.outputs.outcome }}

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance scenario corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      evidence_artifact_url: ${{ steps.acceptance_upload.outputs.artifact-url }}
      outcome: ${{ steps.acceptance.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libssl-dev libseccomp2 mesa-vulkan-drivers
      - name: Exercise Rune interactions and render the reference
        id: acceptance
        env:
          SPOTTY_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/spotty-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          python3 Scripts/verify.py acceptance --output "$RUNNER_TEMP/spotty-acceptance"
      - name: Upload acceptance evidence
        id: acceptance_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spotty-acceptance
          if-no-files-found: error
          retention-days: 7

      - name: Require acceptance evidence
        if: always()
        env:
          ACCEPTANCE_RESULT: ${{ steps.acceptance.outcome }}
          ACCEPTANCE_UPLOAD_RESULT: ${{ steps.acceptance_upload.outcome }}
        run: |
          test "$ACCEPTANCE_RESULT" = success
          test "$ACCEPTANCE_UPLOAD_RESULT" = success
