name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      candidate_needed: ${{ steps.inputs.outputs.candidate_needed }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install pinned cbindgen
        run: |
          set -euo pipefail
          CARGO_HOME="$RUNNER_TEMP/spotty-cbindgen-cargo" \
            cargo install cbindgen --locked --version 0.29.4 --root "$RUNNER_TEMP/spotty-cbindgen"
          echo "$RUNNER_TEMP/spotty-cbindgen/bin" >> "$GITHUB_PATH"

      - name: Show Rust toolchain
        run: |
          set -euo pipefail
          rustc --version
          echo "RUST_TOOLCHAIN_KEY=$(rustc --version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Identify playback inputs
        id: inputs
        run: |
          set -euo pipefail
          digest="$(./Backend/spotty-playback/source-input-digest.sh)"
          candidate_needed=true
          project_root="$GITHUB_WORKSPACE"
          source Scripts/playback-xcframework.sh
          pin_url="$(spotty_playback_pin_value url)"
          tag="${pin_url%/*}"
          tag="${tag##*/}"
          if [[ "$tag" == playback-v* ]]; then
            version="${tag#playback-v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Invalid pinned playback version: $version" >&2
              exit 1
            fi
            tag="playback-v$version"
            git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            input_list="$(./Backend/spotty-playback/source-input-digest.sh --print-inputs)"
            paths=()
            while IFS= read -r path; do paths+=("$path"); done <<< "$input_list"
            # Include directories to detect deleted source and license files too.
            paths+=(Backend/spotty-playback/src Scripts/playback-license-overrides)
            if git diff --quiet "$tag" HEAD -- "${paths[@]}"; then
              candidate_needed=false
            else
              diff_status=$?
              if [[ "$diff_status" != 1 ]]; then exit "$diff_status"; fi
            fi
          else
            echo "Building candidate to bootstrap the first versioned engine release"
          fi
          echo "PLAYBACK_INPUT_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "candidate_needed=$candidate_needed" >> "$GITHUB_OUTPUT"
          echo "Playback candidate needed: $candidate_needed"

      - name: Cache Rust verification products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            Backend/spotty-playback/target/debug
            Backend/spotty-playback/target/.rustc_info.json
          key: macos-rust-debug-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Backend/spotty-playback/Cargo.lock') }}
          restore-keys: macos-rust-debug-${{ runner.arch }}-

      - name: Run Rust checks
        run: SPOTTY_CHECK_SCOPE=rust ./Scripts/check.sh

      - name: Cache Rust release build products
        if: steps.inputs.outputs.candidate_needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Backend/spotty-playback/target/aarch64-apple-darwin/release
          key: macos-rust-playback-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_KEY }}-${{ env.PLAYBACK_INPUT_DIGEST }}

      - name: Build candidate playback XCFramework
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        if: steps.inputs.outputs.candidate_needed == 'true'
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/spotty-playback-candidate"
          framework_path="$candidate_root/SpottyPlaybackCore.xcframework"
          archive_path="$candidate_root/SpottyPlaybackCore.xcframework.zip"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"

          ./Backend/spotty-playback/build-xcframework.sh \
            --output "$framework_path" \
            --archive "$archive_path"
          ./Backend/spotty-playback/validate-xcframework.sh \
            "$framework_path" \
            --archive "$archive_path" \
            --for-publish

          (cd "$candidate_root" && shasum -a 256 "$(basename "$archive_path")" > "$(basename "$archive_path").sha256")
          printf 'source_sha=%s\nsource_ref=%s\nsource_input_digest=%s\n' \
            "$(git rev-parse HEAD)" \
            "$SOURCE_HEAD_SHA" \
            "$PLAYBACK_INPUT_DIGEST" > "$candidate_root/source-provenance.txt"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$candidate_root/"
          cp "$framework_path/spotty_playback_provenance.json" "$candidate_root/"
          (cd "$framework_path" && zip -X -q -r "$candidate_root/SpottyPlaybackCore-notices.zip" Notices)

      - name: Upload candidate playback artifact
        if: steps.inputs.outputs.candidate_needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/spotty-playback-candidate
          if-no-files-found: error
          retention-days: 7

  checks:
    name: Debug and deterministic checks
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install verification tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            brew install ripgrep
          fi

      - name: Show toolchains
        run: |
          set -euo pipefail
          {
            swift --version
            uname -m
          } | tee "$RUNNER_TEMP/swift-toolchain.txt"
          xcrun --find swift-format
          xcrun swift-format --version
          grep -q 'Apple Swift version 6.3.3' "$RUNNER_TEMP/swift-toolchain.txt"
          echo "SWIFT_TOOLCHAIN_KEY=$(shasum -a 256 "$RUNNER_TEMP/swift-toolchain.txt" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Block Rust tools
        run: |
          set -euo pipefail
          blocked_tools="$RUNNER_TEMP/spotty-no-rust-tools"
          mkdir -p "$blocked_tools"
          for tool in cargo rustc rustup cbindgen; do
            printf '#!/bin/sh\necho "%s is blocked in the Swift lane" >&2\nexit 127\n' "$tool" > "$blocked_tools/$tool"
            chmod 755 "$blocked_tools/$tool"
          done
          echo "$blocked_tools" >> "$GITHUB_PATH"

      - name: Cache SwiftPM build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/*
            !.build/spotty-signing
          key: macos-swiftpm-debug-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-swiftpm-debug-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-
            macos-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-

      - name: Run checks
        run: SPOTTY_CHECK_SCOPE=swift ./Scripts/check.sh

  candidate:
    name: Candidate Swift ${{ matrix.configuration }}
    needs: [rust]
    if: needs.rust.outputs.candidate_needed == 'true' && needs.rust.result == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Download candidate playback artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playback-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/spotty-playback-candidate

      - name: Block Rust tools and select candidate
        run: |
          set -euo pipefail
          blocked_tools="$RUNNER_TEMP/spotty-no-rust-tools"
          mkdir -p "$blocked_tools"
          for tool in cargo rustc rustup cbindgen; do
            printf '#!/bin/sh\necho "%s is blocked in the Swift candidate lane" >&2\nexit 127\n' "$tool" > "$blocked_tools/$tool"
            chmod 755 "$blocked_tools/$tool"
          done
          echo "$blocked_tools" >> "$GITHUB_PATH"
          candidate_path="$RUNNER_TEMP/spotty-playback-candidate/SpottyPlaybackCore.xcframework"
          test -d "$candidate_path"
          echo "SPOTTY_PLAYBACK_LOCAL_XCFRAMEWORK=$candidate_path" >> "$GITHUB_ENV"

      - name: Install verification tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            brew install ripgrep
          fi

      - name: Show Swift toolchain
        run: |
          set -euo pipefail
          {
            swift --version
            uname -m
          } | tee "$RUNNER_TEMP/swift-toolchain.txt"
          xcrun --find swift-format
          xcrun swift-format --version
          grep -q 'Apple Swift version 6.3.3' "$RUNNER_TEMP/swift-toolchain.txt"
          echo "SWIFT_TOOLCHAIN_KEY=$(shasum -a 256 "$RUNNER_TEMP/swift-toolchain.txt" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Cache SwiftPM candidate build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/*
            !.build/spotty-signing
          key: macos-swiftpm-candidate-${{ matrix.configuration }}-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}

      - name: Run candidate Swift checks
        env:
          SPOTTY_BUILD_CONFIGURATION: ${{ matrix.configuration }}
          SPOTTY_CHECK_SCOPE: swift
        run: ./Scripts/check.sh

  release:
    name: Release distribution compile
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchains
        run: |
          set -euo pipefail
          {
            swift --version
            uname -m
          } | tee "$RUNNER_TEMP/swift-toolchain.txt"
          grep -q 'Apple Swift version 6.3.3' "$RUNNER_TEMP/swift-toolchain.txt"
          echo "SWIFT_TOOLCHAIN_KEY=$(shasum -a 256 "$RUNNER_TEMP/swift-toolchain.txt" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Block Rust tools
        run: |
          set -euo pipefail
          blocked_tools="$RUNNER_TEMP/spotty-no-rust-tools"
          mkdir -p "$blocked_tools"
          for tool in cargo rustc rustup cbindgen; do
            printf '#!/bin/sh\necho "%s is blocked in the Swift lane" >&2\nexit 127\n' "$tool" > "$blocked_tools/$tool"
            chmod 755 "$blocked_tools/$tool"
          done
          echo "$blocked_tools" >> "$GITHUB_PATH"

      - name: Cache SwiftPM release build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/*
            !.build/spotty-signing
          key: macos-swiftpm-release-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-swiftpm-release-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-
            macos-swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-

      - name: Compile release Spotty with SPOTTY_DISTRIBUTION
        run: ./Scripts/compile-release-spotty.sh

      - name: Report release build size
        run: |
          set -euo pipefail
          ./Scripts/report-size.sh --out-dir "$RUNNER_TEMP"

      - name: Upload size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report
          path: ${{ runner.temp }}/size-report.json
          retention-days: 30

  gate:
    name: Debug quality gate
    if: always()
    needs: [rust, checks, candidate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every quality lane
        env:
          CANDIDATE_NEEDED: ${{ needs.rust.outputs.candidate_needed }}
          RUST_RESULT: ${{ needs.rust.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$CHECKS_RESULT" = success
          if [[ "$CANDIDATE_NEEDED" == true ]]; then
            test "$CANDIDATE_RESULT" = success
          else
            test "$CANDIDATE_NEEDED" = false
            test "$CANDIDATE_RESULT" = skipped
          fi
          test "$RELEASE_RESULT" = success
