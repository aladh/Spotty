name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Source policies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust_needed: ${{ steps.rust-scope.outputs.rust_needed }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Rust verification
        id: rust-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "rust_needed=true" >> "$GITHUB_OUTPUT"
          else
            if [[ ! "$INPUT_BASE_SHA" =~ ^[0-9a-f]{40}$ || "$INPUT_BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "Rust selection requires a valid PR base SHA" >&2
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "$INPUT_BASE_SHA"
            if git cat-file -e "$INPUT_BASE_SHA:Scripts/ci_rust_policy.py"; then
              trusted_policy="$(mktemp "$RUNNER_TEMP/spotty-rust-policy.XXXXXX")"
              trap 'rm -f "$trusted_policy"' EXIT
              git show "$INPUT_BASE_SHA:Scripts/ci_rust_policy.py" > "$trusted_policy"
              python3 "$trusted_policy" --event "$EVENT_NAME" --base "$INPUT_BASE_SHA" >> "$GITHUB_OUTPUT"
            else
              # The first PR introducing this policy must verify Rust too.
              echo "rust_needed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Read ast-grep version
        id: ast-grep
        run: |
          set -euo pipefail
          version="$(cat Scripts/ast-grep/version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check source policies
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6 # v1.5.0
        with:
          version: ${{ steps.ast-grep.outputs.version }}
          config: sgconfig.yml
          paths: Sources Backend/spotty-playback/src

      - name: Check rule fixtures and policy owners
        run: ./Scripts/check-source-policy.sh --test-only

  macos:
    name: macOS checks
    needs: [policy]
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      rust_result: ${{ steps.rust.outcome }}
      debug_result: ${{ steps.debug.outcome }}
      release_result: ${{ steps.release.outcome }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install pinned cbindgen
        if: needs.policy.outputs.rust_needed == 'true'
        run: |
          set -euo pipefail
          CARGO_HOME="$RUNNER_TEMP/spotty-cbindgen-cargo" \
            cargo install cbindgen --locked --version 0.29.4 --root "$RUNNER_TEMP/spotty-cbindgen"
          echo "$RUNNER_TEMP/spotty-cbindgen/bin" >> "$GITHUB_PATH"

      - name: Show Rust toolchain
        if: needs.policy.outputs.rust_needed == 'true'
        run: |
          set -euo pipefail
          rustc --version
          echo "RUST_TOOLCHAIN_KEY=$(rustc --version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Identify playback inputs
        if: needs.policy.outputs.rust_needed == 'true'
        id: inputs
        env:
          INPUT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./Scripts/playback-candidate-needed.sh

      - name: Cache Rust verification products
        if: needs.policy.outputs.rust_needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            Backend/spotty-playback/target/debug
            Backend/spotty-playback/target/.rustc_info.json
          key: macos-rust-debug-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Backend/spotty-playback/Cargo.lock') }}
          restore-keys: macos-rust-debug-${{ runner.arch }}-

      - name: Run Rust checks
        id: rust
        if: needs.policy.outputs.rust_needed == 'true'
        run: SPOTTY_CHECK_SCOPE=rust ./Scripts/check.sh

      - name: Cache Rust release build products
        if: steps.inputs.outputs.candidate_needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Backend/spotty-playback/target/aarch64-apple-darwin/release
          key: macos-rust-playback-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_KEY }}-${{ env.PLAYBACK_INPUT_DIGEST }}

      - name: Build candidate playback XCFramework
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        if: steps.inputs.outputs.candidate_needed == 'true'
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/spotty-playback-candidate"
          framework_path="$candidate_root/SpottyPlaybackCore.xcframework"
          archive_path="$candidate_root/SpottyPlaybackCore.xcframework.zip"
          rm -rf "$candidate_root"
          mkdir -p "$candidate_root"

          ./Backend/spotty-playback/build-xcframework.sh \
            --output "$framework_path" \
            --archive "$archive_path"
          ./Backend/spotty-playback/validate-xcframework.sh \
            "$framework_path" \
            --archive "$archive_path" \
            --for-publish

          (cd "$candidate_root" && shasum -a 256 "$(basename "$archive_path")" > "$(basename "$archive_path").sha256")
          printf 'source_sha=%s\nsource_ref=%s\nsource_input_digest=%s\n' \
            "$(git rev-parse HEAD)" \
            "$SOURCE_HEAD_SHA" \
            "$PLAYBACK_INPUT_DIGEST" > "$candidate_root/source-provenance.txt"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$candidate_root/"
          cp "$framework_path/spotty_playback_provenance.json" "$candidate_root/"
          (cd "$framework_path" && zip -X -q -r "$candidate_root/SpottyPlaybackCore-notices.zip" Notices)

      - name: Upload candidate playback artifact
        if: steps.inputs.outputs.candidate_needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/spotty-playback-candidate
          if-no-files-found: error
          retention-days: 7

      - name: Install verification tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            brew install ripgrep
          fi

      - name: Show toolchains
        run: |
          set -euo pipefail
          {
            swift --version
            uname -m
          } | tee "$RUNNER_TEMP/swift-toolchain.txt"
          xcrun --find swift-format
          xcrun swift-format --version
          grep -q 'Apple Swift version 6.3.3' "$RUNNER_TEMP/swift-toolchain.txt"
          echo "SWIFT_TOOLCHAIN_KEY=$(shasum -a 256 "$RUNNER_TEMP/swift-toolchain.txt" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Block Rust tools
        run: |
          set -euo pipefail
          blocked_tools="$RUNNER_TEMP/spotty-no-rust-tools"
          mkdir -p "$blocked_tools"
          for tool in cargo rustc rustup cbindgen; do
            printf '#!/bin/sh\necho "%s is blocked in the Swift lane" >&2\nexit 127\n' "$tool" > "$blocked_tools/$tool"
            chmod 755 "$blocked_tools/$tool"
          done
          echo "$blocked_tools" >> "$GITHUB_PATH"

      - name: Cache SwiftPM build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/*
            !.build/spotty-signing
          key: macos-swiftpm-combined-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-swiftpm-combined-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-

      - name: Run checks
        id: debug
        run: SPOTTY_CHECK_SCOPE=swift ./Scripts/check.sh

      - name: Compile release Spotty with SPOTTY_DISTRIBUTION
        id: release
        run: ./Scripts/compile-release-spotty.sh

      - name: Report release build size
        run: |
          set -euo pipefail
          ./Scripts/report-size.sh --out-dir "$RUNNER_TEMP"

      - name: Upload size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report
          path: ${{ runner.temp }}/size-report.json
          retention-days: 30

  gate:
    name: Debug quality gate
    if: always()
    needs: [policy, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every quality lane
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_NEEDED: ${{ needs.policy.outputs.rust_needed }}
          RUST_RESULT: ${{ needs.macos.outputs.rust_result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          CHECKS_RESULT: ${{ needs.macos.outputs.debug_result }}
          RELEASE_RESULT: ${{ needs.macos.outputs.release_result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$MACOS_RESULT" = success
          if [[ "$RUST_NEEDED" == true ]]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_NEEDED" = false
            test "$RUST_RESULT" = skipped
          fi
          test "$CHECKS_RESULT" = success
          test "$RELEASE_RESULT" = success
