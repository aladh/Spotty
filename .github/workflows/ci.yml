name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests and synthetic UI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow and shell source policies
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          version="$(cat Scripts/ast-grep/version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rules='^(workflow-action-pins|workflow-checkout-credentials|workflow-explicit-permissions|workflow-shell-interpolation|ci-fail-closed|ci-read-permissions|script-no-xtrace)$'
          npm exec --yes --package "@ast-grep/cli@$version" -- ast-grep test --filter "$rules" --skip-snapshot-tests
          npm exec --yes --package "@ast-grep/cli@$version" -- ast-grep scan --filter "$rules" .github/workflows Scripts script Rune
      - name: Cache locked Cargo source dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('Rune/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify review automation
        run: |
          npm ci --ignore-scripts --prefix Scripts/agent-review-tests
          npm test --prefix Scripts/agent-review-tests
      - name: Check documentation and notices
        run: |
          python3 Scripts/documentation_policy.py
          python3 -B Scripts/test_notices_policy.py
      - name: Test acceptance evidence collection
        run: python3 -B Scripts/test_verify.py
      - name: Install build and graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libssl-dev libseccomp2 mesa-vulkan-drivers
      - name: Verify the integrated app, named traces and synthetic reference
        env:
          SPOTTY_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/spotty-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          python3 Scripts/verify.py acceptance --output "$RUNNER_TEMP/spotty-acceptance"
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spotty-acceptance
          if-no-files-found: error

  apple:
    name: Apple Silicon verification
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '27.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache locked Cargo source dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('Rune/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Select Apple Silicon SDK
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_27.app
          test "$(xcrun --sdk macosx --show-sdk-version)" = 27.0
      - name: Build and test the native app
        run: ./Scripts/check.sh
      - name: Package and verify the release bundle
        run: ./Scripts/package-app.sh --release

  macos:
    name: macOS checks
    if: always()
    needs: [linux, apple]
    runs-on: ubuntu-latest
    steps:
      - name: Require both platforms
        env:
          LINUX: ${{ needs.linux.result }}
          APPLE: ${{ needs.apple.result }}
        run: test "$LINUX" = success && test "$APPLE" = success
