name: OpenCode Thermos review

on:
  pull_request_target:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review again (posts another comment)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: opencode-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Select eligible PR and skip automatic repeats
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "PR number must be a positive integer" >&2; exit 1; }
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .draft == false and .head.repo.full_name == $repo' <<< "$pr" > /dev/null; then
            echo 'Skipping: PR is closed, draft, or from a fork'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            jq -r '"BASE_SHA=" + .base.sha, "HEAD_SHA=" + .head.sha' <<< "$pr" >> "$GITHUB_ENV"
          else
            found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- spotty-thermos-review -->")) | .id')
            if [ -n "$found" ]; then
              echo 'Skipping: automatic review already published'
              echo 'skip=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout trusted reviewer configuration
        if: steps.eligibility.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/review
          path: reviewer

      - name: Install OpenCode
        if: steps.eligibility.outputs.skip != 'true'
        run: npm install --prefix "$RUNNER_TEMP/thermos-cli" opencode-ai@1.18.29

      - name: Checkout PR source and history
        if: steps.eligibility.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Review and comment
        if: steps.eligibility.outputs.skip != 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_DISABLE_PROJECT_CONFIG: 'true'
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thermos"
          cp -R "$GITHUB_WORKSPACE/reviewer/.github/review/." "$RUNNER_TEMP/thermos/"
          export OPENCODE_CONFIG="$RUNNER_TEMP/thermos/opencode.json"
          "$RUNNER_TEMP/thermos-cli/node_modules/.bin/opencode" --pure run \
            --agent thermos --variant xhigh \
            "Run Thermos on $GITHUB_REPOSITORY PR #$PR_NUMBER and post the result. The checkout is at head $HEAD_SHA; the PR base is $BASE_SHA."
