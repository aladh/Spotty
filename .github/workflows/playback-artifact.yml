name: Publish playback artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Engine version, e.g. 0.1.0 (publishes playback-v0.1.0)
        required: true
        type: string
      source_ref:
        description: Full 40-character merged main SHA covered by the candidate CI run
        required: true
        type: string
      candidate_run_id:
        description: Main push CI run with successful Rust and candidate Swift Debug/Release checks
        required: true
        type: string
      dry_run:
        description: Validate the candidate without publishing a release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: playback-artifact-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify tested playback candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      version: ${{ steps.candidate.outputs.version }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}

    steps:
      - name: Check out trusted promotion policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify originating CI and candidate bytes
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          ENGINE_VERSION: ${{ inputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python3 Scripts/playback_promotion.py \
            --version "$ENGINE_VERSION" \
            --run-id "$CANDIDATE_RUN_ID" \
            --source-ref "$SOURCE_REF" \
            --output "$RUNNER_TEMP/spotty-playback-publication"

      - name: Upload verified publication assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-publication-candidate
          path: ${{ runner.temp }}/spotty-playback-publication
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable playback release
    needs: [prepare]
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified publication assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playback-publication-candidate
          path: ${{ runner.temp }}/spotty-playback-publication

      - name: Refuse an existing engine tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAYBACK_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/$PLAYBACK_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to reuse existing playback tag $PLAYBACK_RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish versioned playback release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.prepare.outputs.release_tag }}
          commit: ${{ needs.prepare.outputs.source_sha }}
          name: SpottyPlaybackCore v${{ needs.prepare.outputs.version }}
          artifacts: ${{ runner.temp }}/spotty-playback-publication/*
          artifactErrorsFailBuild: true
          allowUpdates: false
          replacesArtifacts: false
          immutableCreate: true
          prerelease: true
          makeLatest: false
