name: Stage Rune release archive

on:
  push:
    tags:
      - "rune-v*.*.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ARM64 release
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          test "$(uname -m)" = arm64
          test "$(xcrun --sdk macosx --show-sdk-version)" = 27.0

      - name: Verify tag and runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^rune-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a semantic version tag" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#rune-v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Rune/Info.plist)"
          if [[ "$version" != "$plist_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $plist_version" >&2
            exit 1
          fi
          notes="docs/releases/rune-v$version.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

          runs="$RUNNER_TEMP/main-runs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            --method GET \
            -f head_sha="$GITHUB_SHA" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" > "$runs"
          IFS=$'\t' read -r main_status main_conclusion < <(jq -r \
            '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] |
             sort_by(.run_number) | last |
             if . == null then ["", ""] else [.status, .conclusion // ""] end | @tsv' \
            "$runs")
          if [[ "$main_status" != completed || "$main_conclusion" != success ]]; then
            echo "Latest main CI run is not successful: ${main_status:-missing}/${main_conclusion:-missing}" >&2
            exit 1
          fi

      - name: Build and validate release archive
        env:
          SPOTTY_SIGNING_IDENTITY: "-"
          SPOTTY_RUNE_UPDATE_FEED_URL: ${{ vars.SPOTTY_RUNE_UPDATE_FEED_URL }}
          SPOTTY_RUNE_UPDATE_PUBLIC_KEY: ${{ vars.SPOTTY_RUNE_UPDATE_PUBLIC_KEY }}
        run: |
          version="${GITHUB_REF_NAME#rune-v}"
          ./Scripts/archive-app.sh
          architectures="$(lipo -archs Spotty.app/Contents/MacOS/Spotty)"
          if [[ "$architectures" != "arm64" ]]; then
            echo "Expected an ARM64-only app, found: $architectures" >&2
            exit 1
          fi
          cd dist
          shasum -a 256 "Spotty-Rune-$version.zip" > "Spotty-Rune-$version.zip.sha256"

      - name: Retain the verified archive for release review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spotty-${{ github.ref_name }}
          path: dist/Spotty-Rune-*.zip*
          if-no-files-found: error
