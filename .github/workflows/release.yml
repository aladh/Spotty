name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ARM64 release
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install verification tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            brew install ripgrep
          fi

      - name: Show Swift toolchain
        run: |
          set -euo pipefail
          {
            swift --version
            uname -m
          } | tee "$RUNNER_TEMP/swift-toolchain.txt"
          xcrun --find swift-format
          xcrun swift-format --version
          grep -q 'Apple Swift version 6.3.3' "$RUNNER_TEMP/swift-toolchain.txt"
          echo "SWIFT_TOOLCHAIN_KEY=$(shasum -a 256 "$RUNNER_TEMP/swift-toolchain.txt" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Block Rust tools
        run: |
          set -euo pipefail
          blocked_tools="$RUNNER_TEMP/spotty-no-rust-tools"
          mkdir -p "$blocked_tools"
          for tool in cargo rustc rustup cbindgen; do
            printf '#!/bin/sh\necho "%s is blocked in the app release lane" >&2\nexit 127\n' "$tool" > "$blocked_tools/$tool"
            chmod 755 "$blocked_tools/$tool"
          done
          echo "$blocked_tools" >> "$GITHUB_PATH"

      - name: Cache SwiftPM release build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/*
            !.build/spotty-signing
          key: macos-swiftpm-app-release-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            macos-swiftpm-app-release-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-
            macos-swiftpm-release-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_TOOLCHAIN_KEY }}-

      - name: Verify tag and runner
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a semantic version tag" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          if [[ "$version" != "$plist_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $plist_version" >&2
            exit 1
          fi
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Release job must run on ARM64, not $(uname -m)" >&2
            exit 1
          fi

      - name: Build and validate release archive
        env:
          SPOTTY_SIGNING_IDENTITY: "-"
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./Scripts/archive-app.sh
          architectures="$(lipo -archs Spotty.app/Contents/MacOS/Spotty)"
          if [[ "$architectures" != "arm64" ]]; then
            echo "Expected an ARM64-only app, found: $architectures" >&2
            exit 1
          fi
          mv "dist/Spotty-$version.zip" "dist/Spotty-$version-arm64.zip"
          cd dist
          shasum -a 256 "Spotty-$version-arm64.zip" > "Spotty-$version-arm64.zip.sha256"

      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            > [!CAUTION]
            > **Experimental build:** Spotty uses unsupported, reverse-engineered Spotify interfaces
            > and may stop working without notice. Use it only with an account you control.

            This is an ARM64-only build for Apple-silicon Macs running macOS 15 or newer.

            The artifact has a hardened-runtime, ad-hoc signature because this
            project does not yet have Developer ID and notarization credentials. macOS will not
            automatically trust it as an identified-developer application. You can instead build
            directly from the tagged source using the documented development setup.
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Spotty-$version-arm64.zip" \
            "dist/Spotty-$version-arm64.zip.sha256" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Spotty $version" \
            --notes "$RELEASE_NOTES"
