name: Thermos review

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review again (posts another comment)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thermos-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Select eligible PR and skip automatic repeats
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "PR number must be a positive integer" >&2; exit 1; }
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .draft == false and .head.repo.full_name == $repo' <<< "$pr" > /dev/null; then
            echo 'Skipping: PR is closed, draft, or from a fork'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            jq -r '"BASE_SHA=" + .base.sha, "HEAD_SHA=" + .head.sha' <<< "$pr" >> "$GITHUB_ENV"
          else
            found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" or .user.login == "opencode-agent[bot]") | select(.body | startswith("<!-- spotty-thermos-review -->")) | .id')
            if [ -n "$found" ]; then
              echo 'Skipping: automatic review already published'
              echo 'skip=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout trusted reviewer configuration
        if: steps.eligibility.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/thermos-review
          path: reviewer

      - name: Install OpenCode and ripgrep
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          npm install --prefix "$RUNNER_TEMP/thermos-cli" opencode-ai@1.18.29

      - name: Checkout PR source and history
        if: steps.eligibility.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate as OpenCode App
        id: app-token
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! oidc=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=opencode-github-action" | jq -er '.value | select(type == "string" and length > 0)'); then
            echo '::error::Could not obtain the GitHub OIDC token.'
            exit 1
          fi
          echo "::add-mask::$oidc"
          if ! token=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -X POST \
            -H "Authorization: Bearer $oidc" \
            https://api.opencode.ai/exchange_github_app_token | jq -er '.token | select(type == "string" and length > 0)'); then
            echo '::error::OpenCode App token exchange failed. Check the App installation on Spotty and OpenCode service availability.'
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Review and comment
        id: review
        if: steps.eligibility.outputs.skip != 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_DISABLE_PROJECT_CONFIG: 'true'
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
          OPENCODE_ENABLE_EXA: '1'
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          exec > "$RUNNER_TEMP/thermos-review.log" 2>&1
          mkdir -p "$RUNNER_TEMP/thermos"
          cp -R "$GITHUB_WORKSPACE/reviewer/.github/thermos-review/." "$RUNNER_TEMP/thermos/"
          export OPENCODE_CONFIG="$RUNNER_TEMP/thermos/opencode.json"
          "$RUNNER_TEMP/thermos-cli/node_modules/.bin/opencode" --pure run \
            --agent thermos \
            "Run Thermos on $GITHUB_REPOSITORY PR #$PR_NUMBER. The gh and rg CLIs are available. Have the parent post only actionable findings introduced or made reachable by this PR as inline comments (COMMENT, not an approval or change request), and a brief summary via gh pr comment starting with <!-- spotty-thermos-review -->. Omit informational notes and unrelated follow-ups. If no actionable findings remain, say so and state coverage limits; do not declare the PR safe to merge. Support behavioral claims with inspected evidence rather than agreement between auditors."

      - name: Revoke OpenCode App token
        if: ${{ always() && steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh api --method DELETE /installation/token; then
            echo '::warning::Could not revoke the OpenCode App token; it will expire normally.'
          fi
