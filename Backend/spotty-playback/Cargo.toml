[package]
name = "spotty-playback"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Private playback bridge used by the Spotty macOS application"

[lib]
name = "spotty_playback"
crate-type = ["staticlib"]

[dependencies]
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
# ProxySink sends PCM to AVFoundation; opt in to TLS without unused output backends.
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
once_cell = "1.19"
serde_json = "1.0"
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
protobuf = "3"
serde = { version = "1.0", features = ["derive"] }
futures-util = "0.3"
env_logger = "0.11"
log = "0.4"
# Only for the header map and method of the one connect-state request this crate builds
# itself; librespot's spclient takes them by these types.
http = "1"

[profile.release]
opt-level = 3
lto = true

# Narrow retained patches; the remaining graph stays at the reviewed upstream revision.
[patch."https://github.com/librespot-org/librespot"]
librespot-core = { path = "vendor/librespot/core" }
librespot-connect = { path = "vendor/librespot/connect" }
librespot-playback = { path = "vendor/librespot/playback" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061", features = ["spotty-test-harness"] }
