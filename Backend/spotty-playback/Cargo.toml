[package]
name = "spotty-playback"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Private playback bridge used by the Spotty macOS application"

[lib]
name = "spotty_playback"
crate-type = ["staticlib"]

[dependencies]
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
# ProxySink sends PCM to AVFoundation; opt in to TLS without unused output backends.
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
once_cell = "1.19"
serde_json = "1.0"
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9" }
protobuf = "3"
serde = { version = "1.0", features = ["derive"] }
futures-util = "0.3"
env_logger = "0.11"
log = "0.4"
# HTTP request fields required by SpClient, and parsing at the playback URL boundary.
http = "1"

[profile.release]
opt-level = 3
lto = true

# Narrow retained patches; the remaining graph stays at the reviewed upstream revision.
[patch."https://github.com/librespot-org/librespot"]
librespot-core = { path = "vendor/librespot/core" }
librespot-connect = { path = "vendor/librespot/connect" }
librespot-playback = { path = "vendor/librespot/playback" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "4a005903e078d512456fb008aaa9ba6246881bd9", features = ["spotty-test-harness"] }
