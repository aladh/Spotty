language = "C"
pragma_once = true
cpp_compat = true
autogen_warning = "/* This file is generated by cbindgen 0.29.4. Do not edit. */"
include_version = false
documentation = true
documentation_style = "c99"
documentation_length = "full"
style = "both"
sort_by = "Name"
usize_is_size_t = true

includes = ["spotty_playback_annotations.h"]
after_includes = """
#pragma clang assume_nonnull begin
"""

trailer = """
#pragma clang assume_nonnull end
"""

[export.rename]
ConnectionSnapshotCallback = "ConnectionStateCallback"
QueueSnapshotCallback = "QueueCallback"
PlaybackSnapshotCallback = "PlaybackStateCallback"
DevicesSnapshotCallback = "DevicesCallback"
ConnectClusterStateCallback = "ConnectClusterStateCallback"

[export]
# Keep the semantic nullable-pointer aliases in the C shim. cbindgen 0.29.4
# transfers a `cbindgen:no-export` annotation on a pointer alias to its pointee
# struct, so explicit excludes avoid suppressing the generated repr(C) layouts;
# the include list below keeps those pointee layouts in this header.
exclude = [
    "SpottyNullableCString",
    "SpottyNullableMutCString",
    "SpottyNullableCStringArray",
    "SpottyNullableFloatSamples",
    "SpottyNullableStringPairPointer",
    "SpottyNullableRestrictionPointer",
    "SpottyNullableQueueTrackPointer",
    "SpottyNullableDevicePointer",
    "SpottyNullableQueueSnapshot",
    "SpottyNullableConnectionSnapshotPointer",
    "SpottyNullablePlaybackSnapshotPointer",
    "SpottyNullableQueueSnapshotPointer",
    "SpottyPlaybackResult",
    "SpottyPlaybackAudioControlEvent",
]
include = [
    "SpottyStringPair",
    "SpottyRestriction",
    "SpottyProtocolQueueTrack",
    "SpottyQueueSnapshot",
    "SpottyConnectionSnapshot",
    "SpottyProtocolDevice",
    "SpottyDevicesSnapshot",
    "SpottyPlaybackSnapshot",
    "SpottyConnectClusterState",
]
