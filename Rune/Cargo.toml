[package]
name = "spotty-rune"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "10a39584cc1ff739477be52e333a742a024ac956", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "10a39584cc1ff739477be52e333a742a024ac956", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061", default-features = false, features = ["native-tls"] }
once_cell = "1.19"
futures-util = "0.3"
env_logger = "0.11"
log = "0.4"
http = "1"
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
protobuf = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
rtrb = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = "5"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults", "NSValue", "NSDictionary", "NSBundle", "NSURL", "NSError", "NSHTTPCookie", "NSHTTPCookieStorage", "NSArray", "NSNotification", "NSOperation", "block2"] }
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSWorkspace", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGColorSpace"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent", "block2", "objc2-app-kit", "objc2-core-foundation"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061", features = ["spotty-test-harness"] }

# Rune relies on these forks when built outside its own Cargo workspace.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "10a39584cc1ff739477be52e333a742a024ac956" }
winit = { git = "https://github.com/anomalyco/rune", rev = "10a39584cc1ff739477be52e333a742a024ac956" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "10a39584cc1ff739477be52e333a742a024ac956" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "10a39584cc1ff739477be52e333a742a024ac956" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "10a39584cc1ff739477be52e333a742a024ac956" }

[patch."https://github.com/librespot-org/librespot"]
librespot-core = { path = "../Backend/spotty-playback/vendor/librespot/core" }
librespot-connect = { path = "../Backend/spotty-playback/vendor/librespot/connect" }
librespot-playback = { path = "../Backend/spotty-playback/vendor/librespot/playback" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
