id: 'injected-dependencies'
language: 'Swift'
severity: 'error'
message: 'Views and feature stores must use injected dependencies.'
# Views and feature stores are covered by shape, not by a hand-kept inventory: a new store or
# view is in scope the day it is added, including every `PlaybackStore+*` extension file.
files:
  - 'Sources/Spotty/Views/**/*.swift'
  - 'Sources/Spotty/Spotify/*Store*.swift'
  - 'Sources/Spotty/Spotify/PlaybackStore*.swift'
  # The one owner in scope whose name is not a store.
  - 'Sources/Spotty/Spotify/PlaylistMutationController.swift'
# `PlaybackCore` is deliberately not matched here: it is internal to the SpottyEngineAdapter
# target, so no file in scope can name it at all. The package graph owns that boundary.
rule:
  any:
    - kind: 'call_expression'
      has:
        any:
          - kind: 'simple_identifier'
            regex: '^(PartnerAPI|SpotifyConnectAPI|SpotifyWebPlayerAPI)$'
          - kind: 'navigation_expression'
            has:
              kind: 'navigation_suffix'
              has:
                kind: 'simple_identifier'
                regex: '^(PartnerAPI|SpotifyConnectAPI|SpotifyWebPlayerAPI)$'
    - pattern: 'KeymasterAuth.authorize'

    - pattern: 'KeymasterSession.shared'

    - pattern: 'RustPlaybackEngine.shared'
