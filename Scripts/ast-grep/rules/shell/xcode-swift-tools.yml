---
id: xcode-swift-tools
language: Bash
severity: error
message: Use the selected Xcode Swift formatter; do not install or update parallel Swift formatters
  or linters with Homebrew.
files:
- Scripts/**/*.sh
- script/**/*.sh
rule:
  kind: command
  has:
    field: name
    regex: "^brew$"
  all:
  - has:
      kind: word
      regex: "^(install|reinstall|upgrade)$"
  - has:
      any:
      - kind: word
      - kind: string
      - kind: raw_string
      regex: ^["\']?(swift-format|swiftlint)["\']?$
