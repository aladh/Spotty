---
id: artwork-framework-cache
language: Swift
severity: error
message: Request artwork through ArtworkProviding; shared fetching, caches and image
  decoding belong to the account-scoped runtime artwork pipeline.
files:
- Sources/Spotty/Views/**/*.swift
- Sources/Spotty/RootView.swift
note: Issue 424 replaces separate AsyncImage and tint requests with a bounded memory-only
  pipeline. ArtworkPipeline owns account retirement and cache budgets, ArtworkSourceLoader
  owns ephemeral transport, and ArtworkDecoder owns off-main downsampling and tint extraction.
  Views may create CGImage over the already decoded raster. This lexical check cannot detect
  caches disguised as arbitrary collections; lifecycle and byte-bound tests verify the owner.
rule:
  matches: swift-symbol
  regex: "^(AsyncImage|NSCache|URLCache|URLSession|CGImageSourceCreateWithData|CGImageSourceCreateImageAtIndex|CGImageSourceCreateThumbnailAtIndex|CachedAsyncImage|SDWebImageSwiftUI|Kingfisher|Nuke|NukeUI)$"
