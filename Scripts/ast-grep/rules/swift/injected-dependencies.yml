---
id: injected-dependencies
language: Swift
severity: error
message: Views and feature stores must use injected dependencies.
files:
- Sources/Spotty/Views/**/*.swift
- Sources/Spotty/RootView.swift
- Sources/Spotty/Spotify/**/*Store*.swift
- Sources/Spotty/Spotify/**/PlaylistMutationController.swift
- Sources/SpottySessionRuntime/**/*Store*.swift
- Sources/SpottySessionRuntime/**/PlaybackSessionRuntime*.swift
- Sources/SpottySessionRuntime/**/PlaylistMutationController.swift
rule:
  any:
  - matches: swift-symbol
    regex: "^(PartnerAPI|SpotifyConnectAPI|SpotifyWebPlayerAPI|KeymasterSession|RustPlaybackEngine|AudioRenderer|SystemPlaybackClock)$"
  - kind: navigation_expression
    all:
    - has:
        kind: navigation_suffix
        has:
          kind: simple_identifier
          regex: "^(authorize)$"
    - has:
        field: target
        any:
        - kind: simple_identifier
          regex: "^(KeymasterAuth)$"
        - kind: navigation_expression
          has:
            kind: navigation_suffix
            has:
              kind: simple_identifier
              regex: "^(KeymasterAuth)$"
  - kind: navigation_expression
    all:
    - has:
        kind: navigation_suffix
        has:
          kind: simple_identifier
          regex: "^(live)$"
    - has:
        field: target
        any:
        - kind: simple_identifier
          regex: "^(PlaybackEnvironment)$"
        - kind: navigation_expression
          has:
            kind: navigation_suffix
            has:
              kind: simple_identifier
              regex: "^(PlaybackEnvironment)$"
