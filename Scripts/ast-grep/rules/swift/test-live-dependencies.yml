---
id: test-live-dependencies
language: Swift
severity: error
message: Tests and the Demo use injected ports and isolated storage, never live account/engine
  singletons.
files:
- Tests/**/*.swift
rule:
  any:
  - kind: navigation_expression
    all:
    - has:
        kind: navigation_suffix
        has:
          kind: simple_identifier
          regex: "^(shared)$"
    - has:
        field: target
        any:
        - kind: simple_identifier
          regex: "^(KeymasterSession|RustPlaybackEngine|URLSession|HTTPCookieStorage)$"
        - kind: navigation_expression
          has:
            kind: navigation_suffix
            has:
              kind: simple_identifier
              regex: "^(KeymasterSession|RustPlaybackEngine|URLSession|HTTPCookieStorage)$"
  - kind: navigation_expression
    all:
    - has:
        kind: navigation_suffix
        has:
          kind: simple_identifier
          regex: "^(standard)$"
    - has:
        field: target
        any:
        - kind: simple_identifier
          regex: "^(UserDefaults)$"
        - kind: navigation_expression
          has:
            kind: navigation_suffix
            has:
              kind: simple_identifier
              regex: "^(UserDefaults)$"
  - kind: navigation_expression
    all:
    - has:
        kind: navigation_suffix
        has:
          kind: simple_identifier
          regex: "^(live)$"
    - has:
        field: target
        any:
        - kind: simple_identifier
          regex: "^(PlaybackEnvironment)$"
        - kind: navigation_expression
          has:
            kind: navigation_suffix
            has:
              kind: simple_identifier
              regex: "^(PlaybackEnvironment)$"
  - kind: navigation_expression
    all:
    - has:
        kind: navigation_suffix
        has:
          kind: simple_identifier
          regex: "^(authorize)$"
    - has:
        field: target
        any:
        - kind: simple_identifier
          regex: "^(KeymasterAuth)$"
        - kind: navigation_expression
          has:
            kind: navigation_suffix
            has:
              kind: simple_identifier
              regex: "^(KeymasterAuth)$"
