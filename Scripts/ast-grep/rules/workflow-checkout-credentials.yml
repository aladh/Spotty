id: workflow-checkout-credentials
language: Yaml
severity: error
message: Checkouts must explicitly disable persisted credentials.
files:
  - '.github/workflows/*.yml'
rule:
  any:
    - kind: block_mapping
    - kind: flow_mapping
  has:
    all:
      - has:
          field: key
          regex: '^["'']?uses["'']?$'
      - has:
          field: value
          regex: '^["'']?actions/checkout@'
  not:
    has:
      all:
        - has:
            field: key
            regex: '^["'']?with["'']?$'
        - has:
            stopBy: end
            all:
              - has:
                  field: key
                  regex: '^["'']?persist-credentials["'']?$'
              - has:
                  field: value
                  regex: '^["'']?false["'']?$'
