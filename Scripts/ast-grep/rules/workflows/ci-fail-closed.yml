---
id: ci-fail-closed
language: Yaml
severity: error
message: CI jobs and steps must fail on verification errors; continue-on-error may
  only be literal false.
files:
- ".github/workflows/ci.yml"
- ".github/workflows/ci.yaml"
rule:
  matches: yaml-pair
  all:
  - has:
      field: key
      regex: ^["']?continue-on-error["']?$
  - has:
      field: value
      not:
        regex: "^false$"
