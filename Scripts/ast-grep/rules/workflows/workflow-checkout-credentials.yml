---
id: workflow-checkout-credentials
language: Yaml
severity: error
message: Checkouts must explicitly disable persisted credentials.
files:
- ".github/workflows/*.yml"
- ".github/workflows/*.yaml"
rule:
  any:
  - not:
      has:
        matches: correct-with
  - has:
      matches: yaml-pair
      has:
        field: key
        regex: ^["\']?with["\']?$
      not:
        matches: correct-with
  has:
    all:
    - has:
        field: key
        regex: ^["']?uses["']?$
    - has:
        field: value
        regex: ^["']?actions/checkout@
  all:
  - any:
    - kind: block_mapping
    - kind: flow_mapping
utils:
  correct-with:
    matches: yaml-pair
    all:
    - has:
        field: key
        regex: ^["\']?with["\']?$
    - has:
        field: value
        any:
        - kind: block_node
          has:
            kind: block_mapping
            has:
              matches: yaml-pair
              all:
              - has:
                  field: key
                  regex: ^["']?persist-credentials["']?$
              - has:
                  field: value
                  regex: ^["\']?false["\']?$
            not:
              has:
                matches: yaml-pair
                all:
                - has:
                    field: key
                    regex: ^["\']?persist-credentials["\']?$
                - has:
                    field: value
                    not:
                      regex: ^["\']?false["\']?$
        - kind: flow_node
          has:
            kind: flow_mapping
            has:
              matches: yaml-pair
              all:
              - has:
                  field: key
                  regex: ^["']?persist-credentials["']?$
              - has:
                  field: value
                  regex: ^["\']?false["\']?$
            not:
              has:
                matches: yaml-pair
                all:
                - has:
                    field: key
                    regex: ^["\']?persist-credentials["\']?$
                - has:
                    field: value
                    not:
                      regex: ^["\']?false["\']?$
