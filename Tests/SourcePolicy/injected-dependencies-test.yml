id: 'injected-dependencies'
valid:
  - 'dependencies.catalog.search()'
  - '// PartnerAPI()'
  - 'let text = "KeymasterSession.shared"'
  - 'FakePartnerAPI()'
  # PlaybackCore is unreachable from this target; the package graph, not this rule, owns it.
  - 'PlaybackCore.start()'
invalid:
  - 'PartnerAPI()'
  - 'Module.PartnerAPI()'
  - |-
    SpotifyConnectAPI(
     session: session
    )
  - 'SpotifyWebPlayerAPI()'
  - 'KeymasterAuth.authorize()'
  - 'KeymasterSession.shared'
  - 'RustPlaybackEngine.shared'
