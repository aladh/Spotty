---
id: no-generic-effects
valid:
- enum PlaybackEffectID { case queue }
- struct EffectResult {}
- "// import ComposableArchitecture"
- let text = "Effect<Action>"
invalid:
- import ComposableArchitecture
- struct Effect<Action> {}
